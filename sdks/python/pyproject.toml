[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-autofiller"
version = "1.0.0"
description = "Python SDK for the PDF Autofiller API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Engineersmind", email = "team@engineersmind.com"}
]
keywords = ["pdf", "autofiller", "mapper", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
]

[project.scripts]
pdf-autofiller = "pdf_autofiller.cli:main"

[project.urls]
Homepage = "https://github.com/Engineersmind/pdf-autofillr"
Repository = "https://github.com/Engineersmind/pdf-autofillr"
Documentation = "https://github.com/Engineersmind/pdf-autofillr/tree/main/docs"
Issues = "https://github.com/Engineersmind/pdf-autofillr/issues"
Changelog = "https://github.com/Engineersmind/pdf-autofillr/blob/main/sdks/python/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pdf_autofiller*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]
