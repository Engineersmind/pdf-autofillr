# PDF Autofiller - Mapper Configuration
# =====================================
# This file defines file paths and settings for the PDF autofiller mapper module.

[general]
# Enable/disable PDF hash caching (speeds up repeat processing of same PDF structure)
pdf_cache_enabled = true

# Local path for the hash cache registry (always a local filesystem path).
# This file is read/written by the server regardless of MAPPER_STORAGE backend.
# For persistent cache across server restarts, point this to a volume-mounted path.
cache_registry_path = /app/data/cache/hash_registry.json


[mapping]
# Mapping Configuration
# See docs/OLLAMA_SETUP.md for local LLM setup guide

# ============================================
# LLM Model Configuration
# ============================================
# LLM Model - Use LiteLLM format (https://docs.litellm.ai/docs/providers)
#
# CLOUD MODELS (requires API keys):
#   - gpt-4o                                    (OpenAI - best accuracy, ~$15/1M tokens)
#   - gpt-4o-mini                               (OpenAI - fast & cheap, ~$1.5/1M tokens)
#   - claude-3-5-sonnet-20241022                (Anthropic - excellent accuracy, ~$30/1M tokens)
#   - claude-3-5-haiku-20241022                 (Anthropic - fast, ~$4/1M tokens)
#   - bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0  (AWS Bedrock)
#   - azure/gpt-4                               (Azure OpenAI)
#   - vertex_ai/gemini-pro                      (Google Vertex AI)
#
# LOCAL MODELS (FREE - requires Ollama installed and model downloaded):
#   - ollama/qwen2.5:14b                        (Recommended - best accuracy, needs 16GB RAM)
#   - ollama/llama3.1:8b                        (Fast & balanced, needs 8GB RAM)
#   - ollama/mistral:7b                         (Fastest, needs 8GB RAM)
#   - ollama/deepseek-coder:6.7b                (Good JSON output, needs 8GB RAM)
#
# To use Ollama (FREE local LLMs):
#   1. Install: curl -fsSL https://ollama.com/install.sh | sh
#   2. Download model: ollama pull qwen2.5:14b
#   3. Start server: ollama serve
#   4. Set model below: llm_model = ollama/qwen2.5:14b
#   5. See docs/OLLAMA_SETUP.md for full guide
#
# Current model (change this to switch LLM providers):
#llm_model = ollama/llama3.1:8b

llm_model = gpt-5.2

# Max concurrent LLM threads (parallel processing)
# Recommended: 3-10 for cloud APIs, 1-3 for Ollama

llm_max_threads = 10

# LLM Temperature (0.0 = deterministic/consistent, 1.0 = creative/varied)
# Recommended: 0.0-0.1 for form mapping (need consistency)
llm_temperature = 0.05

# Max tokens for LLM response (higher = more fields per chunk)
# Recommended: 4096-8192 for most forms
llm_max_tokens = 8192

# Request timeout in seconds
# Increase for Ollama on slower hardware
llm_timeout = 120

# Max retries on failure
llm_max_retries = 3




# Confidence threshold for mappings
confidence_threshold = 0.7

# Chunking strategy: page, window, or document
chunking_strategy = page

# Use second mapper (RAG) in parallel with semantic mapper
use_second_mapper = false

# Default investor type
default_investor_type = individual


[headers]
# Headers Extraction Configuration
# Headers module uses a separate LLM configuration optimized for document structure extraction

# LLM model for headers — use LiteLLM format (same options as [mapping] llm_model)
# Examples: gpt-4o, gpt-4.1, claude-3-5-sonnet-20241022,
#           bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0, ollama/qwen2.5:14b
headers_llm_model = gpt-4.1

# Temperature for headers LLM (0.0 = deterministic, 1.0 = creative)
# Recommended: 0.0 for consistent structure extraction
headers_temperature = 0.1

# Max tokens for headers LLM response
# Headers typically need more tokens than semantic mapping due to complex prompts
headers_max_tokens = 32000

# Number of pages to process per chunk
# Larger chunks = fewer LLM calls but longer prompts
# Smaller chunks = more LLM calls but faster processing
headers_chunk_size = 5

# Maximum concurrent workers for parallel chunk processing
# Adjust based on your system resources and API rate limits
headers_max_workers = 8


[extraction]
# Extraction Configuration

# Widget line distance threshold (pixels)
widget_line_distance_threshold = 10

# Coordinate rounding precision
rounding = 1


[logging]
# Logging Configuration

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

# Log format
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

# Enable detailed extractor logs
extractor_debug = false

# Enable detailed mapper logs
mapper_debug = false


[performance]
# Performance and Optimization Settings

# Enable async processing where possible
async_enabled = true

# Maximum concurrent operations
max_concurrent_operations = 5

# Timeout for LLM API calls (seconds)
llm_timeout = 300

# Timeout for RAG API calls (seconds)
rag_timeout = 180

# Retry attempts for failed API calls
api_retry_attempts = 3


[gpu]
# ============================================
# GPU Configuration for Local LLMs (Ollama)
# ============================================
# These settings apply when using Ollama models
# Ollama automatically uses GPU if available - no manual configuration needed!
#
# To check GPU usage:
#   NVIDIA: nvidia-smi
#   Apple:  sudo powermetrics --samplers gpu_power -i 1000 -n 1

# GPU acceleration mode
# Options: auto, cuda, mps, cpu
#   - auto: Automatically detect and use available GPU (RECOMMENDED)
#   - cuda: Force NVIDIA CUDA (requires NVIDIA GPU + CUDA toolkit)
#   - mps: Force Apple Silicon GPU (M1/M2/M3 Macs)
#   - cpu: Force CPU-only (no GPU - slower but works everywhere)
gpu_mode = auto

# GPU memory limit in MB (0 = unlimited)
# Useful for multi-GPU systems or running other GPU tasks
# Recommended: Leave 2-4GB free for system
# Examples:
#   - 8GB GPU: set to 6000 (6GB)
#   - 16GB GPU: set to 14000 (14GB)
#   - 24GB GPU: set to 20000 (20GB)
gpu_memory_limit = 0

# Number of GPU layers to offload (Ollama-specific)
# Higher = faster but more VRAM usage
# Options:
#   -1: Auto (all layers on GPU - recommended)
#   0: CPU only (no GPU)
#   35: Good for 7B models on 8GB VRAM
#   80: Good for 70B models on 40GB+ VRAM
num_gpu_layers = -1

# Low VRAM mode (for GPUs with < 8GB VRAM)
# Trades speed for memory efficiency
# Enable if you get "out of memory" errors
low_vram_mode = false

# GPU device selection (for multi-GPU systems)
# 0 = first GPU, 1 = second GPU, etc.
# -1 = use all available GPUs (distributed)
gpu_device = 0


[ollama]
# ============================================
# Ollama-Specific Configuration
# ============================================
# See docs/OLLAMA_SETUP.md for complete setup guide

# Ollama API endpoint
# Default: http://localhost:11434 (when running Ollama on host)
#
# For Docker setups:
#   - macOS/Windows: http://host.docker.internal:11434
#   - Linux: http://172.17.0.1:11434
#   - Ollama in Docker: http://ollama:11434
#
# Override with OLLAMA_API_BASE environment variable
ollama_api_base = http://localhost:11434

# Keep model loaded in memory after use
# true = Faster subsequent calls but uses RAM
# false = Unload after each call (frees RAM)
keep_alive = true

# Context window size (tokens)
# Must not exceed model's max context
# Examples:
#   - llama3.1: 128k tokens
#   - qwen2.5: 32k tokens
#   - mistral: 32k tokens
context_window = 8192

# Recommended models (for reference)
# Download with: ollama pull <model-name>
#
# Best accuracy:    qwen2.5:14b (needs 16GB RAM, 10GB VRAM)
# Balanced:         llama3.1:8b (needs 8GB RAM, 6GB VRAM)
# Fast:             mistral:7b (needs 8GB RAM, 5GB VRAM)
# JSON specialist:  deepseek-coder:6.7b (needs 8GB RAM, 5GB VRAM)


[notifications]
# Notification System Configuration

# Enable Microsoft Teams notifications
teams_notifications_enabled = false

# Teams webhook URL
teams_webhook_url = 

# Notification level: INFO, WARNING, ERROR, CRITICAL
notification_level = WARNING

# Include detailed metadata in notifications
include_metadata = true


