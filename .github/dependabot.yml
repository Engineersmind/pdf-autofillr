version: 2

updates:
  # ── Python (mapper) ───────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /modules/mapper
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 10
    groups:
      production-deps:
        update-types: [minor, patch]
      dev-deps:
        dependency-type: development
        update-types: [minor, patch]

  # ── Python (SDK) ──────────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
