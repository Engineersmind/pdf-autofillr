name: Stale PRs

on:
  schedule:
    - cron: "0 9 * * 1-5"  # 09:00 UTC Mon–Fri (2:30 PM IST)
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # PRs only — don't touch issues
          days-before-issue-stale: -1
          days-before-issue-close: -1

          days-before-pr-stale: 7
          days-before-pr-close: 14

          stale-pr-label: stale
          stale-pr-message: >
            This PR has had no activity for 7 days and has been marked stale.
            It will be closed in 7 more days unless there is new activity.
            Remove the `stale` label or leave a comment to keep it open.

          close-pr-message: >
            This PR was closed after 14 days of inactivity.
            Re-open it or create a new PR if you'd like to continue this work.

          exempt-pr-labels: "wip,blocked,do-not-close"
