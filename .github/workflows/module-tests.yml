name: Module Tests

# Runs tests for chatbot, doc_upload, and rag-pdf-fillr modules.
# Mapper has its own workflow (mapper-tests.yml) due to Java dependency.

on:
  push:
    branches-ignore: [main]
    paths:
      - "modules/chatbot/**"
      - "modules/doc_upload/**"
      - "modules/rag-pdf-fillr/**"
      - ".github/workflows/module-tests.yml"
  pull_request:
    branches: [main, dev, prod]
    paths:
      - "modules/chatbot/**"
      - "modules/doc_upload/**"
      - "modules/rag-pdf-fillr/**"
      - ".github/workflows/module-tests.yml"

jobs:
  # ── Chatbot ──────────────────────────────────────────────────────────────────
  chatbot:
    name: chatbot (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: modules/chatbot

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: modules/chatbot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --tb=short \
            --cov=src/chatbot \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbot-coverage-py${{ matrix.python-version }}
          path: modules/chatbot/coverage.xml

  # ── Doc Upload ───────────────────────────────────────────────────────────────
  doc-upload:
    name: doc_upload (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: modules/doc_upload

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --tb=short \
            --cov=src/pdf_autofillr_doc_upload \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-upload-coverage-py${{ matrix.python-version }}
          path: modules/doc_upload/coverage.xml

  # ── RAG PDF Filler ───────────────────────────────────────────────────────────
  rag-pdf-fillr:
    name: rag-pdf-fillr (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: modules/rag-pdf-fillr

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: modules/rag-pdf-fillr/requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt -r requirements/dev.txt && pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            --tb=short \
            --cov=src/ragpdf \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-coverage-py${{ matrix.python-version }}
          path: modules/rag-pdf-fillr/coverage.xml
