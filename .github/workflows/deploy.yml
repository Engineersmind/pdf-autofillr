name: Deploy

# Triggered by pushes to dev (→ dev Lambda) and main (→ prod Lambda).
# Uses deploy.sh --update: rebuilds Docker image + updates Lambda, skips terraform.
# Terraform applies should be done manually when infra/env-var changes are needed.
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID       — IAM user with ECR push + Lambda update permissions
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              — e.g. us-east-1

on:
  push:
    branches: [dev, main]
    paths:
      - "modules/mapper/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy mapper → ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy
        env:
          ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          chmod +x modules/mapper/deploy/deploy.sh
          modules/mapper/deploy/deploy.sh --env "$ENV" --update

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployed mapper to ${{ github.ref_name == 'main' && 'prod' || 'dev' }} ($(git rev-parse --short HEAD))"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed for ${{ github.ref_name }} — check logs above"
          # Add Teams/Slack webhook notification here if needed
          # curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" -H 'Content-Type: application/json' \
          #   -d '{"text": "❌ pdf-autofillr mapper deploy failed on ${{ github.ref_name }}"}'
