name: Publish SDK to PyPI

# Triggered when a GitHub Release is published.
# Tag format: sdk-v1.2.3
#
# How to release:
#   1. Update version in modules/mapper/sdk/pyproject.toml
#   2. Push to main
#   3. Create a GitHub Release with tag  sdk-v<version>  (e.g. sdk-v1.0.1)
#   4. This workflow runs tests, builds the wheel + sdist, and publishes.
#
# PyPI Trusted Publishing (no API token needed):
#   Set up at https://pypi.org/manage/account/publishing/
#   Publisher:  GitHub Actions
#   Owner:      Engineersmind
#   Repository: pdf-autofillr
#   Workflow:   publish-sdk.yml
#   Environment: pypi

on:
  release:
    types: [published]

jobs:
  # ── Job 1: Run tests before publishing ─────────────────────────────────────
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk-v')

    defaults:
      run:
        working-directory: modules/mapper/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --tb=short -q

  # ── Job 2: Build distribution ───────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: modules/mapper/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. sdk-v1.0.1
          VERSION="${TAG#sdk-v}"            # strip leading sdk-v  →  1.0.1
          PKG_VERSION=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "Tag version:     $VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($VERSION) does not match pyproject.toml ($PKG_VERSION)"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: modules/mapper/sdk/dist/

  # ── Job 3: Publish to PyPI ──────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi

    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
